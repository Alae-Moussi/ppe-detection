name: Trigger auto deployment for ppe-detection-api

on:
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ppe-detection-api-AutoDeployTrigger-6798bcf4*.yml'

  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          containerAppName: ppe-detection-api
          resourceGroup: rg-ppe-detection
